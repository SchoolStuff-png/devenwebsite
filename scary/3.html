<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Press Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col items-center justify-center m-0 select-none">

    <!-- Vertical centered container with elements -->
    <div class="flex flex-col items-center justify-center space-y-8 p-4">
        
        <!-- Top text -->
        <h1 class="text-xl sm:text-2xl font-normal text-black text-center">
            If you're here press the button
        </h1>

        <!-- Large solid red button with NO text -->
        <button id="pressBtn" aria-label="Press button" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-red-600 hover:bg-red-700 active:scale-95 transition-all duration-150 cursor-pointer shadow-md focus:outline-none"></button>

        <!-- Raw number counter below -->
        <div id="counterDisplay" class="text-3xl sm:text-4xl font-semibold text-black tracking-tight">
            0
        </div>

    </div>

    <!-- Custom Modal for Notifications (No alert() used) -->
    <div id="customModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-gray-200 rounded-lg p-6 max-w-xs w-full text-center space-y-4 shadow-xl">
            <h3 id="modalTitle" class="text-base font-semibold text-black">Notice</h3>
            <p id="modalText" class="text-sm text-gray-600">Message content here.</p>
            <button onclick="closeModal()" class="w-full bg-black text-white font-medium py-2 px-4 rounded-md hover:bg-gray-800 transition-colors">
                OK
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global environment variables provided by environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-press-button-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const counterDisplay = document.getElementById('counterDisplay');
        const pressBtn = document.getElementById('pressBtn');

        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('customModal').classList.add('flex');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('flex');
            document.getElementById('customModal').classList.add('hidden');
        }

        if (!firebaseConfig) {
            counterDisplay.innerText = localStorage.getItem('local_count') || '0';
            pressBtn.addEventListener('click', () => {
                let current = parseInt(localStorage.getItem('local_count') || '0') + 1;
                localStorage.setItem('local_count', current);
                counterDisplay.innerText = current;
            });
        } else {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                // Document reference for public counter
                // Strict Path: /artifacts/{appId}/public/data/{collectionName}
                const counterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'counters', 'button_presses');

                async function initAuthAndData() {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }

                        // Listen to live updates using onSnapshot with error handling
                        onSnapshot(counterDocRef, (docSnap) => {
                            if (docSnap.exists()) {
                                const data = docSnap.data();
                                counterDisplay.innerText = data.count ?? 0;
                            } else {
                                setDoc(counterDocRef, { count: 0 }).catch(console.error);
                            }
                        }, (error) => {
                            console.error("Firestore sync error:", error);
                        });

                    } catch (authError) {
                        console.error("Authentication error:", authError);
                    }
                }

                initAuthAndData();

                // Button interaction handler
                pressBtn.addEventListener('click', async () => {
                    if (!auth.currentUser) {
                        showModal("Notice", "Still connecting to server, please try again in a moment.");
                        return;
                    }

                    try {
                        const docSnap = await getDoc(counterDocRef);
                        if (!docSnap.exists()) {
                            await setDoc(counterDocRef, { count: 1 });
                        } else {
                            await updateDoc(counterDocRef, {
                                count: increment(1)
                            });
                        }
                    } catch (err) {
                        console.error("Failed to update counter:", err);
                        showModal("Error", "Could not register your press. Please check your connection.");
                    }
                });

            } catch (initErr) {
                console.error("Firebase initialization failed:", initErr);
            }
        }
    </script>
</body>
</html>
