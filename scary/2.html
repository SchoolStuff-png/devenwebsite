<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <style>
        /* Reset margins and create a completely pitch black canvas */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Include Three.js for 3D rendering -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        // Set up camera (Field of View, Aspect Ratio, Near plane, Far plane)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Extrude a 2D "2" Path into a 3D Shape
        // Since loading custom 3D fonts via JSON can be tricky in a single file, 
        // drawing a 2D shape and extruding it is the most reliable "pure code" method.
        const shape = new THREE.Shape();
        
        // Define the outline path for a stylized number 2
        shape.moveTo(-1, 2);
        shape.quadraticCurveTo(1, 2.5, 1, 1);
        shape.quadraticCurveTo(1, 0, -1, -1.5);
        shape.lineTo(-1, -1.5);
        shape.lineTo(1.2, -1.5);
        shape.lineTo(1.2, -2);
        shape.lineTo(-1.5, -2);
        shape.lineTo(-1.5, -1.2);
        shape.quadraticCurveTo(0.2, 0.2, 0.2, 0.8);
        shape.quadraticCurveTo(0.2, 1.4, -1, 1.3);
        shape.closePath();

        // Extrude settings to give the "2" its 3D depth
        const extrudeSettings = {
            depth: 0.6,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: 0.05,
            bevelThickness: 0.05
        };

        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        
        // Center the geometry so it rotates perfectly around its own middle axis
        geometry.center();

        // 3. Material and Lighting
        // A sleek, semi-reflective material to catch the light emerging from the dark
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc, 
            roughness: 0.3,
            metalness: 0.2
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Subtle ambient light so the dark side of the "2" isn't completely invisible
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);

        // Point light simulating a glowing beacon in the deep void
        const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Move the camera back so we can see the full object
        camera.position.z = 5;

        // 4. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Slowly rotate the number 2 to showcase its 3D volume
            mesh.rotation.x += 0.005;
            mesh.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // 5. Handle Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
