<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <style>
        /* Create a clean, white full-viewport void */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Enable 3D depth perception for the scene */
            perspective: 1000px; 
        }

        /* Container to manage 3D space and handling the continuous spinning */
        .void-container {
            transform-style: preserve-3d;
            animation: spinSlowly 12s linear infinite;
        }

        /* The stylized number 2 */
        .number-two {
            font-family: 'Arial Black', sans-serif;
            font-size: 15rem;
            font-weight: 900;
            color: #222222;
            user-select: none;
            
            /* Layered text shadows extending into negative Z-space to simulate physical 3D thickness */
            text-shadow: 
                0px 1px 0px #111,
                0px 2px 0px #111,
                0px 3px 0px #111,
                0px 4px 0px #111,
                0px 5px 0px #222,
                0px 6px 0px #333,
                0px 7px 0px #444,
                0px 8px 10px rgba(0,0,0,0.15);
                
            /* Secondary gentle floating/breathing effect */
            animation: floatGently 4s ease-in-out infinite alternate;
        }

        /* Smooth 360-degree rotation across horizontal and vertical angles */
        @keyframes spinSlowly {
            0% {
                transform: rotateY(0deg) rotateX(15deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(15deg);
            }
        }

        /* Subtle upward and downward drift */
        @keyframes floatGently {
            0% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(10px);
            }
        }
    </style>
</head>
<body>

    <div class="void-container">
        <div class="number-two">2</div>
    </div>

</body>
</html>
