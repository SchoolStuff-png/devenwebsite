<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spinning 2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Load Three.js -->
    <script src="https://cloudflare.com"></script>
    <!-- Load Font Loader and Text Geometry utilities -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // Pure white void

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting (So the 3D depth is visible)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Load Font & Create 3D Text Mesh
        let textMesh;
        const fontLoader = new THREE.FontLoader();
        
        // Using a standard open-source JSON font hosted on GitHub
        fontLoader.load('https://jsdelivr.net', function (font) {
            
            const geometry = new THREE.TextGeometry('2', {
                font: font,
                size: 3.5,          // Size of the number
                height: 0.8,        // Depth/thickness of the 3D effect
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.05,
                bevelSize: 0.05,
                bevelSegments: 3
            });

            // Center the geometry so it spins perfectly around its own axis
            geometry.center();

            // Material styling (Charcoal gray color)
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.4,
                metalness: 0.1
            });

            textMesh = new THREE.Mesh(geometry, material);
            scene.add(textMesh);
        });

        // 4. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the mesh if it has finished loading
            if (textMesh) {
                textMesh.rotation.y += 0.015; // Horizontal rotation
                textMesh.rotation.x += 0.005; // Subtle tilt rotation
            }

            renderer.render(scene, camera);
        }
        animate();

        // 5. Handle Window Resizing
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
